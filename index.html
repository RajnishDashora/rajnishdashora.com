    <script>
      // Single Page Apps for GitHub Pages — the decoder half of
      // https://github.com/rafgraph/spa-github-pages (404.html is the encoder half).
      // 404.html turns /some/path into /?/some/path; this restores /some/path
      // before the router reads the URL. Prerendered posts don't need it; it keeps
      // unknown paths and old /?/ links working.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
